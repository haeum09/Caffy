<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caffy · 카페인 위험 예측</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
:root{
  --cream:#FAEDDC; --cream2:#F3E3CE; --foam:#FFFBF5;
  --espresso:#5A3A24; --coffee:#7A5236; --caramel:#C8924A; --caramel-d:#A9742F;
  --latte:#E0C39B; --blush:#F2A9A0; --heart:#D2694F;
  --green:#7DB893; --amber:#E1A23C; --red:#DD6B5A; --border:#EAD7B9;
  --kr:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --round:'Quicksand',var(--kr);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--kr);color:var(--espresso);
  background:
    radial-gradient(900px 480px at 85% -8%, #FFF6E8 0%, transparent 60%),
    radial-gradient(700px 420px at -5% 105%, #F7E7CF 0%, transparent 55%),
    var(--cream);
  min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;}
.wrap{max-width:640px;margin:0 auto;padding:26px 18px 56px}

/* ---- header ---- */
.head{text-align:center;position:relative;margin-bottom:6px}
.mascot-head{width:128px;height:128px;object-fit:contain;border-radius:50%;
  animation:bob 4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.steam{position:absolute;left:50%;top:-6px;transform:translateX(-50%);
  display:flex;gap:10px;opacity:.55;pointer-events:none}
.steam span{width:7px;height:20px;border-radius:50%;background:var(--latte);
  filter:blur(3px);animation:rise 3s ease-in-out infinite}
.steam span:nth-child(2){animation-delay:.6s;height:26px}
.steam span:nth-child(3){animation-delay:1.2s}
@keyframes rise{0%{transform:translateY(6px) scale(.8);opacity:0}
  40%{opacity:.6}100%{transform:translateY(-16px) scale(1.1);opacity:0}}
.logo{font-family:var(--round);font-weight:700;font-size:42px;letter-spacing:-.5px;
  margin:2px 0 0;background:linear-gradient(95deg,var(--espresso),var(--caramel));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.logo .h{-webkit-text-fill-color:var(--heart);font-size:30px;vertical-align:8px}
.tag{color:var(--coffee);font-size:14px;font-weight:600;margin-top:-2px}
.lede{color:var(--coffee);font-size:13.5px;margin:8px auto 20px;max-width:42ch;opacity:.9}

/* ---- cards ---- */
.card{background:var(--foam);border:1.5px solid var(--border);border-radius:22px;
  padding:18px 18px;margin:14px 0;box-shadow:0 16px 34px -26px rgba(122,82,54,.5)}
.eyebrow{font-family:var(--round);font-size:13px;letter-spacing:.5px;font-weight:700;
  color:var(--caramel-d);display:flex;align-items:center;gap:8px;margin-bottom:15px}
.eyebrow .ic{font-size:17px}

/* ---- form ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
label{display:block;font-size:12.5px;color:var(--coffee);margin:0 0 6px;font-weight:600}
input,select{width:100%;background:var(--cream2);color:var(--espresso);
  border:1.5px solid var(--border);border-radius:13px;padding:11px 12px;font-size:14px;font-family:var(--kr)}
input:focus,select:focus{outline:2.5px solid var(--caramel);outline-offset:1px;border-color:transparent}
.seg{display:flex;gap:7px}
.seg button{flex:1;background:var(--cream2);border:1.5px solid var(--border);color:var(--coffee);
  border-radius:12px;padding:10px 0;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;font-family:var(--kr)}
.seg button.on{background:#FBE3C9;border-color:var(--caramel);color:var(--caramel-d)}

/* ---- buttons ---- */
.btn{border:0;cursor:pointer;font-family:var(--round);font-weight:700;transition:.15s}
.btn-add{background:var(--cream2);color:var(--coffee);border:1.5px dashed var(--caramel);
  border-radius:13px;padding:11px 0;width:100%;font-size:14px}
.btn-add:hover{background:#FBE3C9;color:var(--caramel-d)}
.btn-go{width:100%;padding:16px 0;font-size:17px;margin-top:4px;border-radius:18px;
  background:linear-gradient(100deg,var(--caramel),var(--caramel-d));color:#FFF8EC;
  box-shadow:0 12px 26px -10px rgba(169,116,47,.6)}
.btn-go:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-go:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none;transform:none}

/* ---- drink list ---- */
.drink{display:flex;align-items:center;gap:10px;background:var(--cream2);
  border:1.5px solid var(--border);border-radius:14px;padding:9px 13px;margin:7px 0;font-size:14px}
.drink .t{font-family:var(--round);color:var(--coffee);font-size:12px;font-weight:600}
.drink .mg{font-family:var(--round);color:var(--caramel-d);font-weight:700;margin-left:auto;white-space:nowrap}
.drink .x{cursor:pointer;color:var(--latte);border:0;background:0;font-size:16px}
.drink .x:hover{color:var(--heart)}
.empty{color:var(--coffee);font-size:13.5px;text-align:center;padding:10px 0;opacity:.8}

/* ---- result ---- */
#result{display:none}
#result.show{display:block;animation:pop .5s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.bubble-row{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px}
.mascot-result{width:78px;height:78px;object-fit:contain;border-radius:50%;flex:0 0 auto}
.bubble{position:relative;background:var(--cream2);border:1.5px solid var(--border);
  border-radius:18px;border-bottom-left-radius:4px;padding:12px 15px;font-size:14.5px;
  color:var(--espresso);font-weight:600;flex:1}
.bubble:after{content:"";position:absolute;left:-8px;bottom:8px;width:14px;height:14px;
  background:var(--cream2);border-left:1.5px solid var(--border);border-bottom:1.5px solid var(--border);
  transform:rotate(45deg)}
.verdict{display:flex;align-items:center;gap:12px;margin:14px 0 2px;justify-content:center}
.stamp{font-family:var(--round);font-weight:700;font-size:17px;padding:9px 22px;border-radius:999px;
  color:#fff;border:2px dashed rgba(255,255,255,.7);transform:rotate(-3deg);
  box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.stamp.low{background:var(--green)} .stamp.mid{background:var(--amber)} .stamp.high{background:var(--red)}
.scorep{color:var(--coffee);font-size:13px;font-family:var(--round);font-weight:600}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px}
.metric{background:var(--cream2);border:1.5px solid var(--border);border-radius:16px;padding:14px 6px;text-align:center}
.metric .v{font-family:var(--round);font-size:23px;font-weight:700;color:var(--espresso)}
.metric .v small{font-size:11px;color:var(--coffee);font-weight:600}
.metric .l{font-size:11px;color:var(--coffee);margin-top:4px}

.chartwrap{margin-top:18px}
.chart-h{font-size:12.5px;color:var(--coffee);margin:0 0 4px;display:flex;justify-content:space-between}
.chart-h b{color:var(--espresso);font-family:var(--round)}
svg.decay{width:100%;height:190px;display:block}

.reasons{margin-top:18px}
.reasons h4,.advice h4,.alts h4{font-family:var(--round);font-size:14px;color:var(--espresso);margin:0 0 10px;font-weight:700}
.reason{display:flex;gap:9px;font-size:14px;color:var(--espresso);padding:5px 0;align-items:flex-start}
.reason .b{flex:0 0 auto}
.advice{margin-top:18px}
.advice .box{background:linear-gradient(180deg,#FBE7DC,#FCEFE4);border:1.5px solid #F2CBB8;
  border-radius:16px;padding:14px;font-size:14.5px;color:var(--espresso)}
.advice .by{font-size:11.5px;color:var(--caramel-d);margin-top:8px;display:flex;align-items:center;gap:6px;font-weight:600}
.spin{width:13px;height:13px;border:2px solid rgba(169,116,47,.25);border-top-color:var(--caramel-d);
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.alts{margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--cream2);border:1.5px solid var(--border);border-radius:999px;
  padding:7px 14px;font-size:13px;color:var(--coffee);font-weight:600}

.disc{color:var(--coffee);font-size:11.5px;text-align:center;margin-top:24px;line-height:1.6;opacity:.85}
.foot{text-align:center;color:var(--latte);font-family:var(--round);font-size:13px;margin-top:12px;font-weight:600}
@media (max-width:520px){.grid{grid-template-columns:1fr}.metrics{gap:8px}.metric .v{font-size:19px}}
@media (prefers-reduced-motion:reduce){.mascot-head{animation:none}.steam{display:none}#result.show{animation:none}}
</style>

<div class="wrap">
  <div class="head">
    <div class="steam"><span></span><span></span><span></span></div>
    <img class="mascot-head" id="mascotHead" alt="Caffy 마스코트">
    <h1 class="logo">Caffy<span class="h"> ♥</span></h1>
    <div class="tag">오늘 내 카페인, 괜찮을까요?</div>
    <p class="lede">마신 음료와 몸 상태를 알려주면, 밤에 카페인이 얼마나 남아 잠을 방해할지 예측해 드려요.</p>
  </div>

  <div class="card">
    <div class="eyebrow"><span class="ic">🧸</span> 내 정보</div>
    <div class="grid">
      <div><label>나이</label><input id="age" type="number" value="17" min="5" max="100"></div>
      <div><label>체중 (kg)</label><input id="weight" type="number" value="55" min="20" max="150" step="0.5"></div>
      <div><label>최근 수면 시간 (시간)</label><input id="sleep" type="number" value="6" min="0" max="14" step="0.5"></div>
      <div><label>취침 예정 시각</label><input id="bedtime" type="time" value="23:00"></div>
    </div>
    <div style="margin-top:14px"><label>카페인 민감도</label>
      <div class="seg" id="sens">
        <button data-v="낮음">낮음</button><button data-v="보통" class="on">보통</button><button data-v="높음">높음</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow"><span class="ic">☕</span> 오늘 마신 음료</div>
    <div class="grid">
      <div><label>카테고리</label><select id="cat"></select></div>
      <div><label>음료</label><select id="drink"></select></div>
      <div id="sizeWrap"><label>사이즈</label><select id="size"></select></div>
      <div><label>개수</label><input id="qty" type="number" value="1" min="1" max="20"></div>
      <div><label>섭취 시각</label><input id="time" type="time" value="15:00"></div>
      <div style="display:flex;align-items:flex-end"><button class="btn btn-add" onclick="addDrink()">＋ 추가하기</button></div>
    </div>
    <div id="list" style="margin-top:12px"></div>
  </div>

  <button class="btn btn-go" id="goBtn" onclick="analyze()" disabled>☕ 카페인 위험도 분석하기</button>

  <div class="card" id="result">
    <div class="bubble-row">
      <img class="mascot-result" id="mascotResult" alt="Caffy">
      <div class="bubble" id="cute"></div>
    </div>
    <div class="verdict">
      <span class="stamp" id="badge"></span>
      <span class="scorep" id="scorep"></span>
    </div>
    <div class="metrics">
      <div class="metric"><div class="v" id="mTotal"></div><div class="l">총 카페인</div></div>
      <div class="metric"><div class="v" id="mKg"></div><div class="l">체중 대비</div></div>
      <div class="metric"><div class="v" id="mRes"></div><div class="l">취침 시 잔류</div></div>
    </div>
    <div class="chartwrap" id="chartwrap">
      <div class="chart-h"><b>시간에 따른 체내 카페인 ☕</b><span>점선 = 취침 시각</span></div>
      <svg class="decay" id="chart" viewBox="0 0 600 190" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
    <div class="reasons"><h4>🔎 위험 원인</h4><div id="reasons"></div></div>
    <div class="advice"><h4>💛 맞춤 조언</h4><div class="box" id="adviceBox"></div><div class="by" id="adviceBy"></div></div>
    <div class="alts"><h4>🥤 추천 대체 음료</h4>
      <div class="chips">
        <span class="chip">물</span><span class="chip">보리차</span><span class="chip">루이보스티</span>
        <span class="chip">디카페인 커피</span><span class="chip">따뜻한 우유</span>
        <span class="chip">캐모마일티</span><span class="chip">페퍼민트티</span>
      </div>
    </div>
  </div>

  <p class="disc">⚠️ 본 도구는 교육·인식 목적이며 의학적 진단이 아닙니다. 건강 우려가 있으면 전문가와 상담하세요.</p>
  <p class="foot">made with ☕ &amp; ♥ · Caffy</p>
</div>

  $("drink").innerHTML=ds.map(n=>`<option>${n}</option>`).join("");fillSizes();}
function fillSizes(){const info=DB[$("drink").value];
  if(info&&info.sizes){$("sizeWrap").style.display="";$("size").innerHTML=Object.keys(info.sizes).map(s=>`<option>${s}</option>`).join("");}
  else{$("sizeWrap").style.display="none";$("size").innerHTML="";}}
$("cat").onchange=fillDrinks;$("drink").onchange=fillSizes;fillDrinks();
$("sens").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  $("sens").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");sensitivity=b.dataset.v;});
function caffeineOf(name,size){const i=DB[name];if(!i)return 0;
  if(size&&i.sizes&&i.sizes[size]!=null)return i.sizes[size];return i.base||0;}
function addDrink(){const name=$("drink").value,info=DB[name];const size=(info&&info.sizes)?$("size").value:null;
  intakes.push({name,size,caffeine:caffeineOf(name,size),qty:+$("qty").value,time:$("time").value});renderList();}
function renderList(){
  if(!intakes.length){$("list").innerHTML='<div class="empty">음료를 추가하면 분석할 수 있어요 🐾</div>';}
  else{$("list").innerHTML=intakes.map((it,i)=>{const sz=it.size?` (${it.size})`:"";const mg=it.caffeine*it.qty;
    return `<div class="drink">${it.name}${sz} × ${it.qty} <span class="t">${it.time}</span>
      <span class="mg">${mg.toFixed(0)}mg</span><button class="x" onclick="rm(${i})" aria-label="삭제">✕</button></div>`;}).join("");}
  $("goBtn").disabled=!intakes.length;}
function rm(i){intakes.splice(i,1);renderList();}
renderList();

const parseT=s=>{const[a,b]=s.split(":").map(Number);return{h:a,m:b};};
const hoursBetween=(t,bed)=>{let i=t.h*60+t.m,b=bed.h*60+bed.m;if(b<=i)b+=1440;return(b-i)/60;};
function residual(list,bed){let r=0,c=false;for(const it of list){if(!it.time)continue;c=true;
  const h=hoursBetween(parseT(it.time),bed);r+=it.caffeine*it.qty*Math.pow(0.5,h/HALF_LIFE);}return c?r:null;}
const thresholds=a=>a<=18?{pkH:2.5,pkM:1.5,tH:200,tM:100}:{pkH:5.7,pkM:3,tH:400,tM:200};
const SENS={낮음:0,보통:1,높음:2};const classify=s=>s<=3?"낮음":s<=6?"보통":"높음";
function computeRisk(p){
  const total=intakes.reduce((s,i)=>s+i.caffeine*i.qty,0);
  const perKg=p.weight>0?total/p.weight:0;const res=residual(intakes,parseT(p.bedtime));
  const th=thresholds(p.age);let score=0;const reasons=[];
  if(perKg>=th.pkH){score+=3;reasons.push(`체중 1kg당 카페인이 ${perKg.toFixed(2)}mg으로 권장 상한(${th.pkH}mg/kg)을 넘었습니다.`);}
  else if(perKg>=th.pkM){score+=1;reasons.push(`체중 대비 카페인이 ${perKg.toFixed(2)}mg/kg로 다소 높은 편입니다.`);}
  if(total>=th.tH){score+=2;reasons.push(`오늘 총 카페인이 ${total.toFixed(0)}mg으로 많은 편입니다.`);}
  else if(total>=th.tM){score+=1;reasons.push(`오늘 총 카페인이 ${total.toFixed(0)}mg입니다.`);}
  if(p.sleep<6){score+=2;reasons.push(`최근 수면 시간이 ${p.sleep}시간으로 부족합니다.`);}
  if(res!=null){
    if(res>=100){score+=3;reasons.push(`취침 시점에도 약 ${res.toFixed(0)}mg의 카페인이 남아 수면을 방해할 가능성이 큽니다.`);}
    else if(res>=50){score+=2;reasons.push(`취침 시점에 약 ${res.toFixed(0)}mg이 남아 있어 잠들기 어려울 수 있습니다.`);}
    else if(res>=25){score+=1;reasons.push(`취침 시점에 약 ${res.toFixed(0)}mg이 남아 있습니다.`);}}
  const s=SENS[sensitivity]||0;
  if(s>0){score+=s;if(s===2)reasons.push("카페인 민감도가 높아 같은 양에도 영향을 더 크게 받습니다.");}
  return {total,perKg,residual:res,score,level:classify(score),reasons};}

function drawChart(bed){
  const timed=intakes.filter(i=>i.time);const svg=$("chart");
  if(!timed.length){$("chartwrap").style.display="none";return;}
  $("chartwrap").style.display="";
  const mins=i=>{const t=parseT(i.time);return t.h*60+t.m;};
  let start=Math.min(...timed.map(mins));let bedM=bed.h*60+bed.m;if(bedM<=start)bedM+=1440;
  const end=bedM+90;
  const active=M=>timed.reduce((s,i)=>{let t0=mins(i);if(t0<start)t0+=1440;
    if(M<t0)return s;return s+i.caffeine*i.qty*Math.pow(0.5,(M-t0)/60/HALF_LIFE);},0);
  const pts=[];for(let M=start;M<=end;M+=10)pts.push([M,active(M)]);
  const maxY=Math.max(...pts.map(p=>p[1]),1)*1.15;
  const W=600,H=190,padB=22,padT=10;
  const X=M=>(M-start)/(end-start)*W;const Y=v=>H-padB-(v/maxY)*(H-padB-padT);
  let d=`M ${X(pts[0][0])} ${Y(pts[0][1])}`;pts.slice(1).forEach(p=>d+=` L ${X(p[0])} ${Y(p[1])}`);
  const area=d+` L ${X(end)} ${H-padB} L ${X(start)} ${H-padB} Z`;
  const bx=X(bedM),by=Y(active(bedM));
  const fmt=M=>{M=Math.round(M)%1440;const h=Math.floor(M/60),m=M%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;};
  svg.innerHTML=`<defs>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8924A" stop-opacity=".42"/><stop offset="1" stop-color="#C8924A" stop-opacity="0"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <line x1="0" y1="${H-padB}" x2="${W}" y2="${H-padB}" stroke="#EAD7B9" stroke-width="1.5"/>
    <path d="${area}" fill="url(#ag)"/>
    <path d="${d}" fill="none" stroke="#C8924A" stroke-width="3" filter="url(#gl)" stroke-linejoin="round"
      pathLength="1" class="ln" style="stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1s ease forwards"/>
    <line x1="${bx}" y1="${padT}" x2="${bx}" y2="${H-padB}" stroke="#7A5236" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>
    <circle cx="${bx}" cy="${by}" r="5" fill="#7A5236"/>
    <text x="${bx}" y="${padT+1}" fill="#7A5236" font-size="12" font-family="Quicksand,sans-serif" font-weight="700"
      text-anchor="${bx>W-70?'end':'middle'}">🌙 ${fmt(bedM)}</text>
    <text x="2" y="${H-7}" fill="#A9742F" font-size="11" font-family="Quicksand,sans-serif" font-weight="600">${fmt(start)}</text>
    <text x="${W-2}" y="${H-7}" fill="#A9742F" font-size="11" font-family="Quicksand,sans-serif" font-weight="600" text-anchor="end">${fmt(end)}</text>`;
  if(!document.getElementById('dashkf')){const st=document.createElement('style');st.id='dashkf';
    st.textContent='@keyframes dash{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.ln{animation:none!important;stroke-dashoffset:0!important}}';
    document.head.appendChild(st);}}

function analyze(){
  const p={age:+$("age").value,weight:+$("weight").value,sleep:+$("sleep").value,bedtime:$("bedtime").value};
  const r=computeRisk(p);
  $("cute").textContent=CUTE[r.level];
  const b=$("badge");b.textContent=r.level;b.className="stamp "+(r.level==="낮음"?"low":r.level==="보통"?"mid":"high");
  $("scorep").textContent=`위험 점수 ${r.score}점`;
  $("mTotal").innerHTML=`${r.total.toFixed(0)}<small> mg</small>`;
  $("mKg").innerHTML=`${r.perKg.toFixed(2)}<small> mg/kg</small>`;
  $("mRes").innerHTML=r.residual!=null?`${r.residual.toFixed(0)}<small> mg</small>`:`—`;
  $("reasons").innerHTML=r.reasons.length
    ? r.reasons.map(x=>`<div class="reason"><span class="b">☕</span><span>${x}</span></div>`).join("")
    : `<div class="reason"><span class="b">🌿</span><span>특별한 위험 요인이 발견되지 않았어요. 안심하세요!</span></div>`;
  drawChart(parseT(p.bedtime));
  $("result").classList.add("show");
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
  $("adviceBox").textContent=ADVICE[r.level];$("adviceBy").textContent="";
  getAIFeedback(r,p);}

async function getAIFeedback(r,p){
  const by=$("adviceBy");by.innerHTML=`<span class="spin"></span> Caffy가 맞춤 피드백을 쓰는 중…`;
  const drinks=intakes.map(i=>`${i.name}×${i.qty}`).join(", ")||"없음";
  const sys="너는 'Caffy'라는 귀여운 카페인 건강 도우미야. 분석 결과를 보고 따뜻하고 살짝 귀여운 한국어로 6문장 이내 피드백을 써. 첫 줄은 ☕로 시작하는 한 줄 요약, 다음 2~3문장으로 왜 이런 결과인지 쉽게 설명, 마지막에 실천 조언 1~2가지. 의학적 단정은 피하고 '~할 수 있어요' 표현 사용. 마크다운 강조(**)는 쓰지 마.";
  const usr=`나이 ${p.age}세, 체중 ${p.weight}kg, 최근 수면 ${p.sleep}시간, 민감도 ${sensitivity}, 섭취 ${drinks}. 총 카페인 ${r.total.toFixed(0)}mg, 체중대비 ${r.perKg.toFixed(2)}mg/kg, 취침 잔류 ${r.residual!=null?r.residual.toFixed(0)+'mg':'정보없음'}, 위험도 ${r.level}(${r.score}점). 원인: ${r.reasons.join(" / ")||"특이사항 없음"}.`;
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,messages:[{role:"user",content:usr}]})});
    if(!resp.ok)throw new Error(resp.status);
    const data=await resp.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
    if(text){$("adviceBox").textContent=text;by.innerHTML="✨ Claude가 작성한 맞춤 피드백";}else throw new Error("empty");
  }catch(e){by.textContent="";}}
</script>
